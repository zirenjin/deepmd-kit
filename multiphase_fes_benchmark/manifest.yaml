version: 1
protocol: static_fixed_representative_v1
adapter_pretraining: none_free_energy_foundation
formal_label_counts: [0, 1, 2, 4, 8]
evaluation:
  metrics: [delta_g_mae_eV_per_atom, delta_g_rmse_eV_per_atom, sign_accuracy, tc_pred_K, tc_abs_error_K]
  split: leave_one_material_or_phase_pair_out
  leakage_diagnostic: temperature_dependent_structure_only
datasets:
  - id: sio2_beta_quartz_beta_cristobalite
    material: SiO2
    phases: [beta-quartz, beta-cristobalite]
    pressure_GPa: 0.0
    reference: DFT-TI/PBE-D3(BJ)
    source_url: https://darus.uni-stuttgart.de/dataset.xhtml?persistentId=doi%3A10.18419%2FDARUS-4999
    source_paper: https://www.nature.com/articles/s41524-025-01874-1
    curve: continuous
    status: ready
    note: Existing case; formal static-only representative structures must be regenerated/verified before scoring.
  - id: ice_ih_ice_ic
    material: H2O
    phases: [ice-Ih, ice-Ic]
    pressure_GPa: 0.0
    reference: revPBE0-D3 with nuclear quantum effects and anharmonic free-energy workflow
    source_url: https://archive.materialscloud.org/2018.0020/v1
    source_paper: https://arxiv.org/abs/1811.08630
    curve: stage-1
    status: stage-1
    note: Public archive contains workflow inputs and training/reference assets; extract a common-temperature Delta G curve.
  - id: wb_alpha_beta
    material: WB
    phases: [alpha-I41/amd, beta-Cmcm]
    pressure_GPa: 0.0
    reference: anharmonic ML-forcefield TI plus thermodynamic perturbation correction
    source_url: https://www.nature.com/articles/s41524-023-01120-6
    curve: stage-1
    status: stage-1
    note: Supplementary free-energy values span approximately 300-3000 K; verify machine-readable download and fixed representatives.
  - id: hfo2_monoclinic_tetragonal
    material: HfO2
    phases: [monoclinic-P21/c, tetragonal-P42/nmc]
    pressure_GPa: 0.0
    reference: finite-temperature ML-forcefield free energies with perturbative correction
    source_url: https://www.nature.com/articles/s41524-023-01120-6
    curve: stage-1
    status: stage-1
    note: Candidate for temperature-driven phase transition; extract curves rather than using only the reported transition temperature.
  - id: mg sio3_pv_ppv
    material: MgSiO3
    phases: [bridgmanite-Pnma, post-perovskite-Cmcm]
    pressure_GPa: [120, 130, 135]
    reference: anharmonic ML-forcefield TI plus perturbative pressure correction
    source_url: https://www.nature.com/articles/s41524-023-01120-6
    curve: boundary-only
    status: boundary-only
    note: Strong pressure benchmark, but the public article currently exposes sparse P-T points rather than a dense single-P curve.
  - id: al_fcc_hcp
    material: Al
    phases: [fcc, hcp]
    pressure_GPa: [0, 100, 217]
    reference: finite-temperature ML-forcefield phase-diagram calculations
    source_url: https://www.nature.com/articles/s41524-023-01120-6
    curve: boundary-only
    status: boundary-only
    note: Useful for P-driven adaptation after the continuous T-curve cases are staged.
